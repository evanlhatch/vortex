# Runs SQL benchmarks once for a pull request.
# Called from bench-dispatch.yml when SQL benchmark labels are added.

name: PR SQL Benchmarks

concurrency:
  group: >-
    ${{ github.workflow }}-${{ inputs.benchmark_profile || 'base' }}-${{
      github.head_ref || github.run_id
    }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      benchmark_profile:
        required: false
        type: string
        default: "base"
      pr_number:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      benchmark_profile:
        description: "SQL benchmark profile to run"
        required: false
        type: choice
        default: "base"
        options:
          - "base"
          - "full"
      pr_number:
        description: "PR number for benchmark result comments"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write  # for commenting on PRs
  id-token: write  # enables AWS-GitHub OIDC

jobs:
  sql:
    uses: ./.github/workflows/sql-benchmarks.yml
    secrets: inherit
    with:
      mode: "pr"
      pr_number: ${{ inputs.pr_number }}
      benchmark_profile: "full"
      bloom_skip_index: true
      benchmark_matrix: |
        [
          {
            "id": "clickbench-nvme",
            "subcommand": "clickbench",
            "name": "Clickbench on NVME",
            "data_formats": ["parquet", "vortex"],
            "pr_targets": [{"engine": "datafusion", "format": "parquet"}, {"engine": "datafusion", "format": "vortex"}],
            "develop_targets": [{"engine": "datafusion", "format": "parquet"}, {"engine": "datafusion", "format": "vortex"}]
          }
        ]
